# Render 무료 플랜은 15분간 접속이 없으면 서버가 잠듭니다.
# 10분마다 /healthz 를 호출해서 서버를 깨어 있게 유지합니다.
# 저장소 Settings → Secrets and variables → Actions → Variables 에
# SITE_URL (예: https://english-buddy-xxxx.onrender.com) 을 추가하세요.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL 변수가 설정되지 않아 건너뜁니다."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 "${SITE_URL%/}/healthz"
